# The frozen benchmark.
#
# Every number this project quotes should be reproducible by `cli evaluate`, and every one
# that matters should fail a build if it regresses. These bounds are set from a measured run,
# not chosen to be flattering, and each carries the reason it exists. Loosening one is a
# decision that belongs in knowledge/CHANGELOG.md.
#
# Bounds sit a little outside the measured value so ordinary variation passes and a real
# regression does not. They are floors and ceilings, not targets: beating them is expected.

version: 1
frozen_on: 2026-09-11
dataset: 1,636 records, 4 simulated CPSEs, 4 families, 664 true identities

# RE-FROZEN AGAIN after investigating why our merges looked worse than a competitor's.
# Every identity-defining attribute must now be KNOWN before a pair can merge, not merely
# agree where stated. Leaving them optional let a pair merge on everything else agreeing while
# the one thing distinguishing them went unwritten, which was the cause of all 43 genuine false
# merges. Precision 0.880 -> 0.981, genuine false merges 43 -> 6, hard-negative false merge
# rate 0.0250 -> 0.0028, cluster purity 0.890 -> 0.972.
#
# It is bought with recall: 0.709 -> 0.551. That is the Fellegi-Sunter three-way decision
# working as designed, not a loss. Those pairs are not abandoned; they move into the clerical
# band and become questions, and the stopping curve says a small number of answers clears most
# of the queue. A false merge puts the wrong part in a pipeline; an abstention asks somebody.
# The recall floor below is deliberately low: it is a tripwire against the matcher going
# silent altogether, not a target.
#
# RE-FROZEN when the benchmark grew from one family to four. Several bounds are LOOSER than
# the single-family set, and that is a dataset change rather than a regression being waved
# through: gaskets, bearings and ball valves each carry more attributes that a description can
# omit, so more pairs correctly reach `insufficient_evidence` and pairwise recall falls from
# 0.82 to 0.70. Precision and cluster purity both IMPROVED (0.903 to 0.889 pairwise, purity
# 0.870 to 0.908), which is the shape you want: a harder benchmark should cost recall, not
# safety. The one-family numbers are in knowledge/CHANGELOG.md under 2026-09-10.
command: PYTHONPATH=backend SAMEPART_MODE=live SAMEPART_MODEL_MATCHING=1 python -m samepart.cli evaluate --check

thresholds:
  # ── Retrieval ────────────────────────────────────────────────────────────────────────
  retrieval.pairs_completeness:
    min: 0.99
    why: >-
      A true pair that blocking never proposes cannot be recovered downstream, so this is the
      hard ceiling on everything else. Measured 1.00; anything below 1.00 means a real
      duplicate is now invisible to the system.
  retrieval.reduction_ratio:
    min: 0.97
    why: >-
      Completeness is trivially buyable by comparing everything, so it is only meaningful
      beside the share of comparisons avoided. Measured 0.9939.

  # ── Decision ─────────────────────────────────────────────────────────────────────────
  decision.pairwise.precision:
    min: 0.95
    why: >-
      Measured 0.9927. Tightened hard: precision is the axis that matters for a national
      identifier, and a regression here means wrong merges are shipping.
  decision.pairwise.recall:
    min: 0.45
    why: >-
      Measured 0.5419, and floored well below it on purpose. Recall was traded for precision
      when identity-defining attributes were made mandatory; the pairs given up became
      questions rather than disappearing. This bound exists to catch a matcher that abstains
      on everything, which would score perfectly on precision and be useless.
  decision.pairwise.f1:
    min: 0.65
    why: >-
      Measured 0.7011. F1 weights recall and precision equally, which this system
      deliberately does not, so it is the least meaningful number here and is bounded
      loosely on purpose.
  decision.false_merges_with_conflicting_evidence:
    max: 15
    why: >-
      The one that matters. A false merge puts the wrong part in a pipeline, and this counts
      only pairs where some attribute was stated on both records and disagreed -- a real
      matcher error, not a label artefact. Measured 1 of 1,772 same-material verdicts across four families, down from 43. Adding within-CPSE duplicates briefly pushed this to 22; every one traced to an extraction defect (the gasket ring read as the winding) or a demo fixture's made-up label, both fixed.
  decision.false_separations:
    max: 45
    why: >-
      Cheaper than a false merge -- it leaves a duplicate rather than creating a hazard -- so
      the bound is looser on purpose. Measured 0.
  decision.abstention_rate:
    max: 0.30
    why: >-
      Abstaining is correct behaviour, but a matcher that abstains on everything is useless
      while scoring perfectly on precision. This stops that. Measured 0.221.

  # ── Hard negatives ───────────────────────────────────────────────────────────────────
  hard_negatives.false_merge_rate:
    max: 0.03
    why: >-
      Pairs alike enough to be proposed but genuinely different: the pairs a text matcher
      merges. Performance here is the whole argument for typed attributes and conflict gates.
      Measured 0.0012 across 10,551 such pairs, down from 0.0250.

  # ── Outcome ──────────────────────────────────────────────────────────────────────────
  outcome.bcubed.f1:
    min: 0.80
    why: Cluster-level quality, per-record rather than per-pair. Measured 0.8265; B-cubed recall carries the same deliberate trade.
  outcome.cluster_purity:
    min: 0.94
    why: >-
      Share of final clusters containing exactly one true identity. An impure cluster is one a
      steward has to unpick by hand. Measured 0.9922: four impure clusters out of 515.

  # ── Cost ─────────────────────────────────────────────────────────────────────────────
  tiers.share_without_a_model:
    min: 0.90
    why: >-
      The architectural claim: the cheap deterministic tiers carry the overwhelming majority
      and the model is reserved for the band they cannot settle. If this falls, the cascade
      has stopped earning its keep. Measured 1.00 with the model tier off, 0.9436 with it on.

# Reported, deliberately un-thresholded:
#   decision.indistinguishable_pairs   labelled different, no attribute disagrees. Nothing
#                                      could separate these, so they measure the labels, not
#                                      the matcher. Measured 12, down from 96 once the
#                                      generator honoured its own equivalence rules.
#
# Known weak spot: bearing_ball scores worst of the four (precision 0.757, purity 0.750). It
# has the fewest distinguishing attributes and its cage material is informational, so two
# bearings differing only in cage look identical to the gates. Recorded rather than tuned
# away -- see `cli evaluate` BY FAMILY.
#   price_flag.*                       a screening signal on a small sample, not a claim.
