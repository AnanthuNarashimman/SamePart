# Material family definition. This file is DATA, not code. Adding a family means adding a
# file like this one; no pipeline change is required. That is what makes a live bootstrap
# of a new family possible in front of an evaluator.
family: hex_bolt
label: Bolt, hex head
version: 1

# Noun-modifier naming, per the NATO item-name convention that ISO 8000 description rules
# also follow: noun first, then design/type modifiers, then dimensions, then material and
# standard, then finish.
naming:
  noun: BOLT
  modifier: HEX HEAD
  short_template: "{noun}, {modifier}; {thread_designation}X{length_mm}; {grade}; {standard}"
  long_template: "{noun}, {modifier}; thread {thread_designation}; length {length_mm} MM; property class {grade}; standard {standard}; finish {finish}"

# criticality drives the conflict gates:
#   identity      - if these agree, it is the same item regardless of description
#   critical      - disagreement means a different material, always
#   major         - disagreement means different unless a substitution rule applies
#   informational - disagreement never blocks a merge
attributes:
  - key: manufacturer
    label: Manufacturer
    type: string
    criticality: identity
    aliases: [make, brand, mfr, manufacturer name, oem]

  - key: manufacturer_part_number
    label: Manufacturer part number
    type: string
    criticality: identity
    normalise: [upper, strip_non_alnum]
    aliases: [mpn, part no, part number, cat no, catalogue no, mfr part no]

  - key: thread_diameter_mm
    label: Nominal thread diameter
    type: number
    unit: mm
    dimension: length
    criticality: critical
    aliases: [dia, diameter, nominal dia, size, thread size]
    patterns:
      - 'M\s?(?P<value>\d+(?:\.\d+)?)\s?[xX*]'
      - '\bDIA\s+(?P<value>\d+(?:\.\d+)?)\s?MM'
      - '(?P<value>\d+(?:\.\d+)?)\s?mm\s+dia'

  - key: thread_pitch_mm
    label: Thread pitch
    type: number
    unit: mm
    dimension: length
    criticality: major
    aliases: [pitch, thread pitch]
    patterns:
      - 'M\s?\d+(?:\.\d+)?\s?[xX*]\s?(?P<value>\d\.\d+)\b'

  - key: length_mm
    label: Nominal length under head
    type: number
    unit: mm
    dimension: length
    criticality: critical
    aliases: [length, lg, long, shank length]
    patterns:
      - 'M\s?\d+(?:\.\d+)?\s?[xX*]\s?(?P<value>\d+(?:\.\d+)?)'
      - '\b(?:LG|LENGTH)\s+(?P<value>\d+(?:\.\d+)?)\s?MM'
      - '(?P<value>\d+(?:\.\d+)?)\s?mm\s+(?:lg|long|length)'

  - key: grade
    label: Property class or grade
    type: enum
    criticality: critical
    normalise: [upper, strip_spaces]
    aliases: [grade, property class, class, material grade, strength grade]
    values: [A2-70, A4-70, A2-80, A4-80, "8.8", "10.9", "12.9", "4.6", ASTM-A325, ASTM-A490]
    value_aliases:
      SS304 A2-70: A2-70
      AISI 304 A2-70: A2-70
      STAINLESS A2-70: A2-70
      SS316 A4-70: A4-70
      AISI 316 A4-70: A4-70
      ASTM A325: ASTM-A325
      ASTM A490: ASTM-A490
    patterns:
      - '\b(?P<value>A[24][\s-]?[78]0)\b'
      - '\bgrade\s?(?P<value>\d{1,2}\.\d)\b'
      - '\b(?P<value>\d{1,2}\.\d)\b'
      - '\bASTM\s?(?P<value>A325|A490)\b'

  - key: head_type
    label: Head type
    type: enum
    criticality: critical
    required_for_decision: false
    normalise: [upper, strip_spaces]
    aliases: [head, head style, drive]
    values: [HEX, HEXFLANGE, SOCKET, COUNTERSUNK, CARRIAGE]
    # Written out in full by the verbose house style. The extractor used to find HEX inside
    # HEXAGON by accident; now that it will not read part of a word, the word is declared.
    value_aliases:
      "HEXAGON": HEX
      "HEXAGONAL": HEX
      "HEX HD": HEX
      "HEXAGON HEAD": HEX

  - key: standard
    label: Governing specification
    type: enum
    criticality: major
    # Identity-defining: it appears in synthesis.identity_keys, so two materials
    # differing only in this are different stock items. Not knowing it therefore makes
    # the pair undecidable rather than mergeable -- the same abstention principle the
    # critical attributes already follow.
    required_for_decision: true
    normalise: [upper, strip_spaces]
    aliases: [standard, spec, specification, governing spec, as per]
    values: [ISO4014, ISO4017, DIN931, DIN933, ASMEB18.2.1, IS1364]
    value_aliases:
      ISO 4014: ISO4014
      ISO 4017: ISO4017
      DIN 931: DIN931
      DIN 933: DIN933
      IS 1364: IS1364
      "IS:1364": IS1364
    patterns:
      - '\b(?P<value>ISO\s?40(?:14|17))\b'
      - '\b(?P<value>DIN\s?9(?:31|33))\b'
      - '\b(?P<value>IS\s?1364)\b'

  - key: finish
    label: Surface finish
    type: enum
    criticality: critical
    # A different finish IS a different stock item, but a finish nobody wrote down does not
    # make the pair undecidable. Most descriptions omit it.
    required_for_decision: false
    normalise: [upper, strip_spaces]
    aliases: [finish, coating, plating, surface treatment]
    values: [PLAIN, ZINCPLATED, HOTDIPGALVANISED, PTFE, PASSIVATED]
    value_aliases:
      SELF COLOUR: PLAIN
      SELF COLOR: PLAIN
      BLACK: PLAIN
      UNCOATED: PLAIN
      ZP: ZINCPLATED
      ELECTRO GALVANISED: ZINCPLATED
      ELECTRO GALVANIZED: ZINCPLATED
      ZINC PLATED: ZINCPLATED
      HDG: HOTDIPGALVANISED
      GALVANISED: HOTDIPGALVANISED
      GALVANIZED: HOTDIPGALVANISED
      HOT DIP GALV: HOTDIPGALVANISED
      PICKLED AND PASSIVATED: PASSIVATED

  - key: thread_designation
    label: Thread designation
    type: derived
    criticality: informational
    derive: "M{thread_diameter_mm:g}"

# Where this family sits in the classification backbone. Declared, not inferred: once
# extraction has decided a record is a hex bolt, its class is known. UNSPSC 31161600 is
# Manufacturing Components and Supplies > Hardware > Bolts. The free codeset stops at class
# level for fasteners, so there is no commodity code to reach.
classification:
  system: UNSPSC
  code: "31161600"

# Retrieval strategy, declared as data. Records whose primary key is fully extracted are
# blocked on it exactly. Records that fail to parse fall back to text similarity over the
# canonical form, which is the only place an embedding model is used.
blocking:
  primary_key: [thread_diameter_mm, length_mm]
  fallback: canonical_text
  fallback_top_k: 20

# Automation policy. The system merges without asking only when there is nothing to judge.
auto_merge:
  # OFF by default, which is the posture the problem statement describes: a workflow
  # ALLOWING users to review and approve. An organisation turns automation on deliberately,
  # having seen measured precision on its own data. It is also the better demonstration,
  # because the moment worth showing is a person approving a merge.
  enabled: false
  require_all_known: true      # no critical attribute unknown on either side
  require_score: 1.0           # every comparable attribute agrees exactly
  forbid_gate_override: true   # no gate had to step in
  audit_sample_rate: 0.05      # 1 in 20 auto-merges is still shown to a person

# Deterministic conflict gates. These run AFTER whichever tier produced a verdict and can
# override it. They are never a model call. ~20 lines of rules a domain reviewer can read.
gates:
  - id: identity_match
    when: all_present
    attributes: [manufacturer, manufacturer_part_number]
    rule: all_equal
    action: force_same
    message: "Same manufacturer and part number. Identity is established without inference."

  - id: critical_conflict
    when: both_present
    attributes: [thread_diameter_mm, length_mm, grade, head_type, finish]
    rule: any_not_equal
    action: force_different
    message: "A critical attribute differs. These are not the same material."

  - id: missing_critical
    when: either_missing
    attributes: [thread_diameter_mm, length_mm, grade]
    action: force_insufficient
    message: "A critical attribute is unknown on at least one record. Cannot decide safely."

  - id: major_conflict
    when: both_present
    attributes: [standard, thread_pitch_mm]
    rule: any_not_equal
    action: downgrade_to_alternative
    message: "Specification or pitch differs. Substitution may be acceptable but identities stay separate."

# Substitution is contextual. Two materials can be interchangeable for one application and
# not for another, so an alternative verdict carries the condition under which it holds.
substitution_groups:
  - id: stainless_property_class
    attribute: grade
    members: [A2-70, A4-70]
    relation: possible_alternative
    condition: >-
      A4 (316-type) is required where chloride or marine exposure is present.
      A2 (304-type) is acceptable for dry indoor service. Do not substitute A2 for A4
      in coastal or offshore installations.

  - id: metric_strength_class
    attribute: grade
    members: ["8.8", "10.9"]
    relation: possible_alternative
    condition: >-
      10.9 may substitute for 8.8 where the joint is not designed for controlled yield.
      8.8 must never substitute for 10.9. Direction matters; this relation is not symmetric.

  - id: hex_bolt_standard
    attribute: standard
    members: [ISO4014, DIN931]
    relation: equivalent
    condition: >-
      DIN 931 was superseded by ISO 4014 for partially threaded hex bolts. Dimensionally
      interchangeable for standard sizes.

# ─────────────────────────────────────────────────────────────────────────────────────────
# How to fabricate a plausible catalogue of this family.
#
# The pipeline never hardcoded a family; the generator did, which left "families are data"
# unprovable. Everything the generator needs is here now, so a new family is one file.
#
# Every technical value below is real: ISO 261 / ISO 724 metric coarse diameters and pitches,
# lengths from the standard series, property classes from ISO 3506 and ISO 898-1, and real
# governing specifications. Generation invents wording, never a value.
synthesis:
  identities: 260
  duplicate_within_org: 0.3
  part_number_prefix: HB
  identity_keys: [thread_diameter_mm, length_mm, grade, standard, finish]

  pools:
    thread_diameter_mm: [6, 8, 10, 12, 16, 20, 24]
    length_mm: [16, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 90, 100, 120]
    grade: ["A2-70", "A4-70", "8.8", "10.9", "12.9"]
    standard: [ISO4014, ISO4017, DIN931, DIN933, IS1364]
    finish: [PLAIN, ZINCPLATED, HOTDIPGALVANISED, PASSIVATED]
    head_type: [HEX]

  # A bolt shorter than twice its diameter is not a bolt anyone stocks.
  constraints:
    - key: length_mm
      at_least_times: thread_diameter_mm
      factor: 2

  # ISO 261 / ISO 724 coarse series. Not invented, and not chosen at random: pitch follows
  # from diameter, which is why it is derived rather than pooled.
  derived:
    thread_pitch_mm:
      from: thread_diameter_mm
      map: {6: 1.0, 8: 1.25, 10: 1.5, 12: 1.75, 16: 2.0, 20: 2.5, 24: 3.0}

  manufacturers:
    - [ANV, "Anvil Fastener Works (sim)"]
    - [TRD, "Trident Bolt & Nut Co (sim)"]
    - [KSL, "Kestrel Industrial Supply (sim)"]
    - [MRD, "Meridian Precision Fixings (sim)"]
    - [QRY, "Quarry Head Fasteners (sim)"]

  # Surface forms the extractor is expected to read.
  words:
    grade:
      "A2-70": ["A2-70", "A2 70", "SS304 A2-70", "AISI 304 A2-70", "STAINLESS A2-70"]
      "A4-70": ["A4-70", "A4 70", "SS316 A4-70", "AISI 316 A4-70"]
      "8.8":   ["8.8", "GR 8.8", "GRADE 8.8", "CLASS 8.8"]
      "10.9":  ["10.9", "GR 10.9", "GRADE 10.9", "CLASS 10.9"]
      "12.9":  ["12.9", "GR 12.9", "GRADE 12.9"]
    standard:
      ISO4014: ["ISO 4014", "ISO4014", "AS PER ISO 4014"]
      ISO4017: ["ISO 4017", "ISO4017"]
      DIN931:  ["DIN 931", "DIN931"]
      DIN933:  ["DIN 933", "DIN933"]
      IS1364:  ["IS 1364", "IS1364", "IS:1364"]
    finish:
      PLAIN:            ["PLAIN", "SELF COLOUR", "BLACK"]
      ZINCPLATED:       ["ZINC PLATED", "ZP", "ELECTRO GALVANISED"]
      HOTDIPGALVANISED: ["HOT DIP GALVANISED", "HDG", "GALVANISED"]
      PASSIVATED:       ["PASSIVATED", "PICKLED AND PASSIVATED"]

  # Surface forms deliberately absent from the attributes' value_aliases above.
  #
  # Without these the generator would only ever write wording the extractor already knows,
  # extraction would score 100% by construction, and the benchmark would measure nothing.
  # These make it possible to fail — a real material master is full of wording nobody
  # anticipated, and the honest response to an unreadable value is `unknown`, not a guess.
  noise_rate: 0.07
  unregistered:
    grade:
      "8.8":   ["PC8.8", "8.8 CL", "PROP CL 8.8"]
      "10.9":  ["PC10.9", "10.9 CL"]
      "12.9":  ["PC12.9", "12.9 CL"]
      "A2-70": ["SS-A2/70", "A2GRADE70"]
      "A4-70": ["SS-A4/70", "A4GRADE70"]
    standard:
      ISO4014: ["ISO-4014-M", "STD ISO4014A"]
      ISO4017: ["ISO-4017-M"]
      DIN931:  ["DIN-931-B"]
      DIN933:  ["DIN-933-B"]
      IS1364:  ["IS1364PT3"]
    finish:
      PLAIN:            ["UNCOATED FIN", "NO COAT"]
      ZINCPLATED:       ["ZN-PLT", "ZINCCOAT"]
      HOTDIPGALVANISED: ["HD-GALV", "GALV-HOT"]
      PASSIVATED:       ["PASSIV.", "PICKLED-PASS"]

  # How often a CPSE simply does not record the fact.
  drop:
    grade: 0.10
    standard: 0.12
    finish: 0.25

  # One line per house style. The organisation that writes it is set in house_styles.yaml.
  templates:
    terse_caps:        "HEX BOLT M{thread_diameter_mm}X{length_mm} | {grade} | {standard} | {finish}"
    verbose_titlecase: "Bolt, Hexagon Head, M{thread_diameter_mm} x {length_mm}mm | {grade} | Conforming to {standard} | {finish}"
    abbreviated:       "BLT HEX HD M{thread_diameter_mm}X{length_mm}MM | {grade} | {standard} | {finish}"
    attribute_list:    "BOLT HEX HEAD; DIA {thread_diameter_mm}MM; LG {length_mm}MM | {grade} | {standard} | {finish}"

  price:
    base: 2.0
    per: {thread_diameter_mm: 0.55, length_mm: 0.045}
    add_when:
      grade: {A: 6.0}          # stainless costs more than carbon steel

  uom_choices: [EA, EA, EA, BOX-100, BOX-50, C, DOZ]
