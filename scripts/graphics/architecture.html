  .region .rt{position:absolute;left:16px;top:10px;font-size:15px;letter-spacing:.09em;font-weight:700;text-transform:uppercase}

  .node .ic svg{width:26px;height:26px}
  .node .t{font-size:18px;font-weight:700;line-height:1.1;letter-spacing:-.005em}
  .node .s{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.25}
  .node .chips{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px 6px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;font-family:"JetBrains Mono",Menlo,monospace;letter-spacing:-.01em;color:var(--ink2);background:#f2f3f6;border-radius:6px;padding:2px 7px 2px 6px}

  .node.red{border-color:var(--red-line);background:var(--red-bg)} .node.red .t{color:var(--red)}
  .node.hot{border-color:var(--green);border-width:2px}
  .lbl{position:absolute;font-size:12px;color:var(--ink3);background:#fff;padding:0 5px;border-radius:5px;white-space:nowrap;font-family:"JetBrains Mono",Menlo,monospace}
  .pill{position:absolute;font-size:12.5px;color:var(--ink2);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;white-space:nowrap}
  .verdicts{position:absolute;display:flex;gap:5px}
  .v{font-size:11.5px;padding:4px 8px;border-radius:7px;font-weight:600;font-family:"JetBrains Mono",Menlo,monospace}
  .v.s{background:#dff5e3;color:#0f5a2a}.v.a{background:#fff3d6;color:#7a5200}.v.d{background:#eeeeeb;color:#444}.v.i{background:#fde8e8;color:#8a1c1c}
  svg.wires{position:absolute;inset:0;width:2400px;height:1180px;pointer-events:none}
  .foot{position:absolute;left:36px;right:36px;bottom:10px;display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}
