    --red:#c8342a; --red-bg:#fdecea; --red-line:#f1b8b2;
    --grey-bg:#f5f6f8; --grey-line:#d9dbe1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);width:2560px;height:1500px;position:relative;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:var(--ink);overflow:hidden}
  .region{position:absolute;border-radius:16px;border:1.5px solid;padding:0}
  .region .rt{position:absolute;left:18px;top:12px;font-size:17px;letter-spacing:.08em;font-weight:700;text-transform:uppercase}
  .region .rs{position:absolute;left:18px;top:36px;font-size:14px;color:var(--ink2)}
  .node{position:absolute;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px 12px 58px;box-shadow:0 1px 2px rgba(20,20,30,.04)}
  .node .ic{position:absolute;left:16px;top:16px;width:28px;height:28px;color:var(--ink2)}
  .node .ic svg{width:28px;height:28px}
  .node .t{font-size:19px;font-weight:700;line-height:1.15;letter-spacing:-.005em}
  .node .s{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.3}
  .node .k{font-size:13px;margin-top:6px;font-weight:600;font-family:"JetBrains Mono",Menlo,monospace;letter-spacing:-.01em}
  .node.red{border-color:var(--red-line);background:var(--red-bg)}
  .node.red .t{color:var(--red)}
  .node.hot{border-color:var(--green);border-width:2px}
  .cyl{position:absolute;background:#fff;border:1.5px solid var(--line);border-radius:60px/16px;padding:26px 16px 14px;text-align:center}
  .cyl:before{content:"";position:absolute;left:0;right:0;top:0;height:22px;border-radius:60px/11px;border:1.5px solid var(--line);border-top:none;background:linear-gradient(#fff,#fff)}
  .cyl .t{font-size:18px;font-weight:700}
  .cyl .s{font-size:13px;color:var(--ink2);margin-top:3px}
  .cyl .k{font-size:12.5px;margin-top:5px;font-weight:600;font-family:"JetBrains Mono",Menlo,monospace}
  .lbl{position:absolute;font-size:13px;color:var(--ink3);background:#fff;padding:0 6px;border-radius:6px;white-space:nowrap;font-family:"JetBrains Mono",Menlo,monospace}
  .pill{position:absolute;font-size:13px;color:var(--ink2);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
  .verdicts{position:absolute;display:flex;gap:6px}
  .v{font-size:12.5px;padding:5px 9px;border-radius:8px;font-weight:600;font-family:"JetBrains Mono",Menlo,monospace}
  .v.s{background:#dff5e3;color:#0f5a2a}.v.a{background:#fff3d6;color:#7a5200}.v.d{background:#eeeeeb;color:#444}.v.i{background:#fde8e8;color:#8a1c1c}
  svg.wires{position:absolute;inset:0;width:2560px;height:1500px;pointer-events:none}
  .foot{position:absolute;left:40px;right:40px;bottom:14px;display:flex;justify-content:space-between;font-size:13px;color:var(--ink3)}
</style>

}
const box = {};
for (const n of NODES) {
  const d = document.createElement('div'); d.className='node'+(n.cls?' '+n.cls:'');
  d.style.cssText=`left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;
  const ink = C[n.tone]||C.grey;
  d.innerHTML=`<div class="ic" style="color:${ink}">${ICON[n.ic]}</div><div class="t">${n.t}</div><div class="s">${n.s}</div><div class="k" style="color:${ink}">${n.k}</div>`;
  root.appendChild(d); box[n.id]=n;
}
// verdict chips under the cascade
const vd = document.createElement('div'); vd.className='verdicts'; vd.style.cssText='left:988px;top:946px';
vd.innerHTML='<span class="v s">same_material</span><span class="v a">possible_alternative</span><span class="v d">different</span><span class="v i">insufficient_evidence</span>';
root.appendChild(vd);
// seat pill on the frontend band
const pill = document.createElement('div'); pill.className='pill'; pill.style.cssText='left:2210px;top:46px'; pill.textContent='sign-in · one account per seat'; root.appendChild(pill);

// wires
const svg = document.getElementById('wires');
const anchors = (n)=>({L:[n.x,n.y+n.h/2], R:[n.x+n.w,n.y+n.h/2], T:[n.x+n.w/2,n.y], B:[n.x+n.w/2,n.y+n.h]});
function path(w) {
  const a=box[w.from], b=box[w.to]; const A=anchors(a), B=anchors(b);
  let d, mid;
  switch (w.via) {
    case 'v':       if (Math.abs(A.B[0]-B.T[0])<4) { d=`M${A.B} L${B.T}`; mid=[A.B[0]+8,(A.B[1]+B.T[1])/2]; }
                    else { const my=(A.B[1]+B.T[1])/2; d=`M${A.B} L${A.B[0]} ${my} L${B.T[0]} ${my} L${B.T}`; mid=[(A.B[0]+B.T[0])/2, my-12]; } break;
    case 'up':      { const my=(A.T[1]+B.B[1])/2; d=`M${A.T} L${A.T[0]} ${my} L${B.B[0]} ${my} L${B.B}`; } break;
    case 'row':     d=`M${A.B} L${A.B[0]} ${w.row} L${B.T[0]} ${w.row} L${B.T}`; mid=[w.lx||(A.B[0]+B.T[0])/2, w.row]; break;
    case 'rowL':    d=`M${A.L} L${A.L[0]-16} ${A.L[1]} L${A.L[0]-16} ${w.row} L${B.T[0]+140} ${w.row} L${B.T[0]+140} ${B.T[1]}`; mid=[w.lx||A.L[0]-16, w.row]; break;
    case 'rowUp':   d=`M${A.T} L${A.T[0]} ${w.row} L${B.B[0]} ${w.row} L${B.B}`; mid=[w.lx||(A.T[0]+B.B[0])/2, w.row]; break;
    case 'vR':      d=`M${A.B[0]+120} ${A.B[1]} L${A.B[0]+120} ${B.T[1]-18} L${B.T[0]} ${B.T[1]-18} L${B.T}`; break;
    case 'vUp':     d=`M${A.T} L${A.T[0]} ${A.T[1]-40} L${B.B[0]} ${A.T[1]-40} L${B.B}`; mid=[(A.T[0]+B.B[0])/2, A.T[1]-46]; break;
    case 'vDown':   d=`M${A.B} L${A.B[0]} ${B.T[1]-20} L${B.T[0]-160} ${B.T[1]-20} L${B.T[0]-160} ${B.T[1]}`; break;
    case 'vDownL':  d=`M${A.L} L${A.L[0]-16} ${A.L[1]} L${A.L[0]-16} ${B.T[1]-40} L${B.T[0]+120} ${B.T[1]-40} L${B.T[0]+120} ${B.T[1]}`; mid=[A.L[0]-16, B.T[1]-46]; break;
    case 'vDownR':  d=`M${A.B} L${A.B[0]} ${A.B[1]+90} L${B.T[0]} ${A.B[1]+90} L${B.T}`; mid=[(A.B[0]+B.T[0])/2, A.B[1]+84]; break;
    case 'h':       if (w.back) { d=`M${A.L} L${B.R}`; mid=[(A.L[0]+B.R[0])/2, A.L[1]-10]; } else { d=`M${A.R} L${B.L}`; mid=[(A.R[0]+B.L[0])/2, A.R[1]-10]; } break;
    case 'elbowL':  d=`M${A.L} L${a.x-40} ${A.L[1]} L${a.x-40} ${b.y-32} L${B.T[0]} ${b.y-32} L${B.T}`; break;
    case 'elbowR':  d=`M${A.R} L${a.x+a.w+40} ${A.R[1]} L${a.x+a.w+40} ${b.y-32} L${B.T[0]} ${b.y-32} L${B.T}`; break;
  }
  return {d, mid};
}
for (const w of WIRES) {
  const {d, mid} = path(w);
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  const col = w.tone==='blue'?'#2f6fd8':w.tone==='orange'?'#d7822a':w.tone==='teal'?'#1f8a9e':w.tone==='purple'?'#7b5cc9':'#8b8b93';
  p.setAttribute('d', d); p.setAttribute('fill','none'); p.setAttribute('stroke', col); p.setAttribute('stroke-width','2');
  if (w.dashed) p.setAttribute('stroke-dasharray','7 6');
  p.setAttribute('marker-end', w.tone==='blue'?'url(#ahb)':w.tone==='orange'?'url(#aho)':'url(#ah)');
  svg.appendChild(p);
  if (w.label && mid) {
    const l = document.createElement('div'); l.className='lbl'; l.textContent=w.label;
    l.style.cssText=`left:${mid[0]}px;top:${mid[1]}px;transform:translate(-50%,-50%);color:${col}`;
    root.appendChild(l);
  }
}
</script>
